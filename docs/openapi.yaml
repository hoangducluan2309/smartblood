# ==============================================================================
# COMPONENTS (SCHEMAS, RESPONSES, SECURITY SCHEMES)
# ==============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nhập chuỗi JWT Access Token (không cần thêm chữ 'Bearer ')

  responses:
    BadRequestError:
      description: Yêu cầu không hợp lệ hoặc vi phạm quy tắc nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Dữ liệu gửi lên không hợp lệ.
            data: null

    UnauthorizedError:
      description: Chưa xác thực hoặc Token không hợp lệ / đã hết hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Vui lòng đăng nhập để thực hiện chức năng này.
            data: null

    ForbiddenError:
      description: Không có quyền truy cập chức năng này
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Bạn không có quyền thực hiện hành động này.
            data: null

    NotFoundError:
      description: Tài nguyên không tồn tại
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Tài nguyên yêu cầu không tồn tại.
            data: null

    ConflictError:
      description: Trùng lặp dữ liệu (Email, SĐT, CCCD)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Email này đã được sử dụng trong hệ thống.
            data: null

    InternalServerError:
      description: Lỗi máy chủ nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Lỗi máy chủ nội bộ. Vui lòng thử lại sau.
            data: null

  schemas:
    # --- Base Response Wrappers ---
    ErrorResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Đã xảy ra lỗi khi xử lý yêu cầu.
        data:
          type: 'null'
          example: null

    # --- User & Auth Schemas ---
    RegisterDTO:
      type: object
      required:
        - hoTen
        - email
        - matKhau
        - soDienThoai
      properties:
        hoTen:
          type: string
          example: Nguyễn Văn Hùng
        email:
          type: string
          format: email
          example: hung.nguyen@gmail.com
        matKhau:
          type: string
          format: password
          minLength: 6
          example: Password@123
        soDienThoai:
          type: string
          example: '0987111222'
        cccd:
          type: string
          example: '079090001234'
        nhomMau:
          type: string
          enum: ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-']
          example: 'O+'
        yeuToRh:
