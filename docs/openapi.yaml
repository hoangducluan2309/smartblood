openapi: 3.0.3
info:
  title: Hệ thống Điều phối Hiến máu Nhân đạo & Dự báo Nhu cầu Máu Khẩn cấp - Backend API
  description: |
    Tài liệu đặc tả API chuẩn OpenAPI 3.0.3 phục vụ phát triển giao diện Frontend và tích hợp dịch vụ.
    Hỗ trợ đầy đủ các phân hệ:
    - **Authentication & Authorization (RBAC)**: Đăng ký, Đăng nhập, Profile, Phân quyền JWT (ADMIN, HOSPITAL_STAFF, DONOR).
    - **Quản lý Sự kiện & Lịch hẹn Hiến máu**: Quy tắc 84 ngày giữa các lần hiến, đồng bộ tồn kho tự động.
    - **Tồn kho & Điều phối Cấp cứu**: Ma trận tương thích nhóm máu, xuất kho FEFO (First Expired First Out).
    - **Dự báo & Cảnh báo Sớm**: Đánh giá nguy cơ thiếu hụt, truy vấn tình nguyện viên khẩn cấp đủ điều kiện.
  version: 1.0.0
  contact:
    name: Đội ngũ Phát triển Backend
    email: backend@hienmau.vn

servers:
  - url: http://localhost:5000
    description: Máy chủ phát triển cục bộ (Local Development Server)

tags:
  - name: System
    description: Kiểm tra tình trạng hoạt động của hệ thống
  - name: Auth
    description: Quản lý xác thực và phân quyền người dùng
  - name: Users
    description: Quản lý danh sách tài khoản người dùng (Chỉ Quản trị viên)
  - name: Donation Events
    description: Quản lý các chiến dịch, ngày hội hiến máu tình nguyện
  - name: Donation Appointments
    description: Đăng ký lịch hẹn hiến máu và cập nhật kết quả hiến
  - name: Blood Inventories
    description: Tra cứu dữ liệu tồn kho máu theo nguyên tắc FEFO và quản lý kho
  - name: Emergency Requests
    description: Tiếp nhận và điều phối xuất kho các đơn cấp cứu máu khẩn cấp
  - name: Forecasts
    description: Phân tích dự báo nguy cơ thiếu hụt và tìm kiếm người hiến khẩn cấp

paths:
  # ============================================================================
  # 0. SYSTEM HEALTH
  # ============================================================================
  /api/health:
    get:
      tags:
        - System
      summary: Kiểm tra tình trạng hoạt động của máy chủ (Health Check)
      description: Kiểm tra máy chủ Backend và dịch vụ kết nối cơ sở dữ liệu.
      responses:
        '200':
          description: Hệ thống hoạt động bình thường
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Hệ thống Backend đang hoạt động ổn định.
                  data:
                    type: object
                    properties:
                      service:
                        type: string
                        example: Blood Donation Coordination & Emergency Prediction API
                      status:
                        type: string
                        example: UP
                      timestamp:
                        type: string
                        format: date-time
                        example: '2026-10-14T00:00:00.000Z'

  # ============================================================================
  # 1. AUTHENTICATION & AUTHORIZATION
  # ============================================================================
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Đăng ký tài khoản người dùng mới
      description: Cho phép người dùng tạo tài khoản mới (mặc định vai trò DONOR).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDTO'
      responses:
        '201':
          description: Đăng ký tài khoản thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Đăng nhập hệ thống nhận JWT Access Token
      description: Xác thực email / số điện thoại / CCCD, mật khẩu và trả về Access Token (thời hạn 1 ngày).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/auth/profile:
    get:
      tags:
        - Auth
      summary: Lấy thông tin cá nhân của người dùng hiện tại
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lấy thông tin thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ============================================================================
  # 1B. USER MANAGEMENT (Chỉ Quản trị viên - ADMIN)
  # ============================================================================
  /api/v1/users:
    get:
      tags:
        - Users
      summary: Xem danh sách tài khoản người dùng (Chỉ Admin)
      description: Hỗ trợ tìm kiếm theo họ tên/email/sđt/cccd, lọc theo vai trò, trạng thái, nhóm máu và phân trang.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Trang hiện tại (mặc định 1)
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Số lượng mỗi trang (mặc định 10)
          required: false
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          description: Từ khóa tìm kiếm (họ tên, email, số điện thoại, CCCD)
          required: false
          schema:
            type: string
        - name: vaiTro
          in: query
          description: Lọc theo vai trò người dùng
          required: false
          schema:
            type: string
            enum: ['ALL', 'ADMIN', 'HOSPITAL_STAFF', 'DONOR']
        - name: trangThai
          in: query
          description: Lọc theo trạng thái tài khoản
          required: false
          schema:
            type: string
            enum: ['ALL', 'HoatDong', 'Khoa']
        - name: nhomMau
          in: query
          description: Lọc theo nhóm máu
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lấy danh sách người dùng thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Lấy danh sách người dùng thành công.
                  data:
                    $ref: '#/components/schemas/PaginatedUserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags:
        - Users
      summary: Tạo tài khoản người dùng mới (Chỉ Admin)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDTO'
      responses:
        '201':
          description: Tạo tài khoản thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Tạo tài khoản người dùng mới thành công.
                  data:
                    $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/users/{id}:
    get:
      tags:
        - Users
      summary: Xem chi tiết thông tin người dùng theo ID (Chỉ Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID người dùng cần xem
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Lấy thông tin người dùng thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Lấy thông tin người dùng thành công.
                  data:
                    $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags:
        - Users
      summary: Cập nhật thông tin tài khoản người dùng (Chỉ Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID người dùng cần cập nhật
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDTO'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Cập nhật tài khoản người dùng thành công.
                  data:
                    $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags:
        - Users
      summary: Xóa vĩnh viễn tài khoản người dùng (Chỉ Admin)
      description: Tự động chuyển quyền sở hữu các đơn yêu cầu, sự kiện sang Admin đang thao tác trước khi xóa an toàn.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID người dùng cần xóa
          schema:
            type: integer
            example: 2
      responses:
        '200':
          description: Xóa người dùng thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Đã xóa vĩnh viễn tài khoản [Nguyễn Văn A] thành công.
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      message:
                        type: string
                        example: Đã xóa vĩnh viễn tài khoản [Nguyễn Văn A] thành công.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/users/{id}/status:
    put:
      tags:
        - Users
      summary: Khóa / Mở khóa nhanh tài khoản (Chỉ Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID người dùng cần đổi trạng thái
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Đổi trạng thái thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Đã đổi trạng thái tài khoản thành Khoa.
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      trangThai:
                        type: string
                        example: Khoa
                      message:
                        type: string
                        example: Đã đổi trạng thái tài khoản thành Khoa.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  # ============================================================================
  # 2. DONATION EVENTS
  # ============================================================================
  /api/v1/donation-events:
    get:
      tags:
        - Donation Events
      summary: Xem danh sách sự kiện hiến máu (Tìm kiếm, Lọc, Phân trang)
      parameters:
        - name: page
          in: query
          description: Trang hiện tại (mặc định 1)
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Số lượng mỗi trang (mặc định 10, tối đa 100)
          required: false
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          description: Từ khóa tìm kiếm theo tên sự kiện hoặc địa điểm
          required: false
          schema:
            type: string
        - name: trangThai
          in: query
          description: Lọc theo trạng thái sự kiện
          required: false
          schema:
            type: string
            enum: ['SapDienRa', 'DangDienRa', 'KetThuc', 'DaHuy']
        - name: tuNgay
          in: query
          description: Lọc theo thời gian bắt đầu từ ngày (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: denNgay
          in: query
          description: Lọc theo thời gian bắt đầu đến ngày (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lấy danh sách sự kiện thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Lấy danh sách sự kiện hiến máu thành công.
                  data:
                    $ref: '#/components/schemas/PaginatedSuKienResponse'
    post:
      tags:
        - Donation Events
      summary: Tạo sự kiện hiến máu mới (Chỉ Admin)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSuKienDTO'
      responses:
        '201':
          description: Tạo sự kiện thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Tạo sự kiện hiến máu thành công.
                  data:
                    $ref: '#/components/schemas/SuKienHienMau'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/donation-events/{id}:
    put:
      tags:
        - Donation Events
      summary: Cập nhật thông tin sự kiện hiến máu (Chỉ Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID sự kiện cần cập nhật
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSuKienDTO'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Cập nhật sự kiện hiến máu thành công.
                  data:
                    $ref: '#/components/schemas/SuKienHienMau'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags:
        - Donation Events
      summary: Xóa sự kiện hiến máu (Chỉ Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID sự kiện cần xóa
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Xóa sự kiện thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Đã xóa sự kiện hiến máu thành công.
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      message:
                        type: string
                        example: Đã xóa sự kiện hiến máu thành công.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/donation-events/{id}/status:
    put:
      tags:
        - Donation Events
      summary: Đổi trạng thái sự kiện hiến máu (Tắt / Khôi phục / Kết thúc - Chỉ Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID sự kiện cần cập nhật trạng thái
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSuKienStatusDTO'
      responses:
        '200':
          description: Đổi trạng thái thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Cập nhật trạng thái sự kiện thành công.
                  data:
                    $ref: '#/components/schemas/SuKienHienMau'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ============================================================================
  # 3. DONATION APPOINTMENTS
  # ============================================================================
  /api/v1/donation-appointments/my-history:
    get:
      tags:
        - Donation Appointments
      summary: Xem lịch sử hiến máu của chính mình (Chỉ Tình nguyện viên - DONOR)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lấy lịch sử hiến máu thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Lấy lịch sử hiến máu thành công.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyDonationHistoryItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/donation-appointments:
    get:
      tags:
        - Donation Appointments
      summary: Lấy danh sách lịch hẹn hiến máu (Donor xem của mình; Admin/Staff xem tất cả)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Trang hiện tại (mặc định 1)
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Số lượng mỗi trang (mặc định 10)
          required: false
          schema:
            type: integer
            default: 10
        - name: trangThai
          in: query
          description: Lọc theo trạng thái lịch hẹn
          required: false
          schema:
            type: string
            enum: ['ChoXacNhan', 'DaXacNhan', 'HoanThanh', 'DaHuy', 'KhongDen']
        - name: suKienId
          in: query
          description: Lọc theo ID sự kiện
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Lấy danh sách lịch hẹn thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Lấy danh sách lịch hẹn hiến máu thành công.
                  data:
                    $ref: '#/components/schemas/PaginatedLichHenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - Donation Appointments
      summary: Đăng ký lịch hẹn hiến máu (Quy tắc 84 ngày)
      description: Donor đăng ký lịch hẹn. Hệ thống kiểm tra khoảng cách lần hiến gần nhất tối thiểu 84 ngày.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLichHenDTO'
      responses:
        '201':
          description: Đăng ký lịch hẹn thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
